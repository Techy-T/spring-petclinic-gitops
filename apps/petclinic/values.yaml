replicaCount: 2

image:
  repository: acrpetclinickydj7o.azurecr.io/petclinic
  tag: "1.0.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

management:
  endpoints: "health,prometheus"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 1

gateway:
  enabled: true
  className: approuting-istio
  name: petclinic-gateway

  listener:
    name: http
    protocol: HTTP
    port: 80

httpRoute:
  enabled: true
  name: petclinic
  pathPrefix: /